[project]
name = "jenkins-preview"
version = "0.8.1"
description = "Publish throwaway copies of Jenkins job sets pinned to your own fork"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Anderson Nogueira" }]
keywords = ["jenkins", "ci", "preview", "jenkins-job-builder"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "jenkins-job-builder==6.5.0",
  "pyyaml>=6",
  "setuptools<81",
]

[project.scripts]
jenkins-preview = "jenkins_preview.cli:main_entry"

[project.urls]
Homepage = "https://github.com/nogueiraanderson/jenkins-preview"
Issues = "https://github.com/nogueiraanderson/jenkins-preview/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jenkins_preview"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
xfail_strict = true

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PTH",  # flake8-use-pathlib
  "C4",   # flake8-comprehensions
  "ARG",  # unused arguments
  "TRY",  # tryceratops
  "RUF",  # ruff-specific
  "ERA",  # eradicate: commented-out code
]
ignore = [
  "TRY003",  # long messages outside the exception class: our errors are the UX
  "E501",    # long lines: handled by the formatter, not worth failing a build
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------- #
# vulture (dead code the per-file linters cannot see: unused module-level
# functions, classes and constants across the whole package)
# --------------------------------------------------------------------------- #

[tool.vulture]
# src only: in tests/, pytest injects fixtures by argument name, which vulture
# reads as unused variables (offline_git, isolated, ...), all false positives.
paths = ["src"]
# 60, not higher: vulture scores every unused function and method at exactly
# 60% confidence, so a higher threshold silently skips the main target.
min_confidence = 60
# The urllib HTTPRedirectHandler.redirect_request override in client.py must
# keep the base class's name and signature; vulture reads both as unused.
ignore_names = ["redirect_request", "fp", "headers", "msg", "newurl", "req"]
